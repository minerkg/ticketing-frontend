<p-dialog [(visible)]="open" (visibleChange)="cancel()" header="Create Ticket" [modal]="true" [style]="{ width: '30rem' }">
  <div class="p-fluid">

    <div class="mb-3">
      <label>Customer</label>
      <p-select
        [options]="clientList"
        [(ngModel)]="ticketCreationRequest.client"
        optionLabel="firstName"
        placeholder="Select Customer">
      </p-select>
    </div>

    <div class="mb-3">
      <label>Ticket Type</label>
      <p-select
        [options]="ticketTypeList"
        [(ngModel)]="ticketCreationRequest.ticketType"
        placeholder="Select Type">
      </p-select>
    </div>

    <div class="mb-3">
      <label>Ticket Element</label>
      <p-select
        [options]="ticketElementNameList"
        [(ngModel)]="ticketCreationRequest.ticketElementName"
        placeholder="Select Element">
      </p-select>
    </div>

    <div class="mb-3">
      <label>Description</label>
      <textarea pInputTextarea [(ngModel)]="ticketCreationRequest.description" rows="5" placeholder="Enter description"></textarea>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" class="p-button-text" (onClick)="cancel()"></p-button>
    <p-button label="Create" (onClick)="createTicket()" [disabled]="!ticketCreationRequest.client || !ticketCreationRequest.ticketType || !ticketCreationRequest.ticketElementName || !ticketCreationRequest.description"></p-button>
  </ng-template>
</p-dialog>
