<p-table [value]="ticketList()">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Type</th>
      <th>Status</th>
      <th>Created By</th>
      <th>Created When</th>
      <th>Assigned To</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-ticket>
    <tr>
      <td>{{ ticket.id }}</td>
      <td>{{ ticket.ticketType }}</td>
      <td>{{ ticket.ticketStatus }}</td>
      <td>{{ ticket.createdBy?.username }}</td>
      <td>{{ ticket.createdWhen | date:'short' }}</td>
      <td>{{ ticket.assignedTo?.username }}</td>
      <td>
        <button pButton
                type="button"
                label="View"
                icon="pi pi-search"
                (click)="viewTicket(ticket)">
        </button>
      </td>
    </tr>
  </ng-template>
</p-table>
