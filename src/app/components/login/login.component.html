<div class="flex justify-center items-center min-h-screen p-6">
  <div class="w-full max-w-sm p-6 shadow-md rounded-lg bg-white">
    <h2 class="text-2xl font-semibold text-center mb-6">Sign in</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
      <p-float-label>
        <input
          pInputText
          id="username"
          type="text"
          name="username"
          [(ngModel)]="credentials.username"
          required
          class="w-full"
        />
        <label for="username">Username</label>
      </p-float-label>

      <p-float-label>
        <input
          pInputText
          id="password"
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          class="w-full"
        />
        <label for="password">Password</label>
      </p-float-label>

      <p-button
        type="submit"
        label="{{ loading() ? 'Signing in...' : 'Login' }}"
        class="w-full"
        [disabled]="loading() || loginForm.invalid"
      ></p-button>
    </form>
  </div>
</div>
