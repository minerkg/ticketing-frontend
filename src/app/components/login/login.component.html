<div class="login-wrapper">
  <div class="login-box">
    <div class="login-header">
      <i class="pi pi-lock login-icon"></i>
      <h2>Sign In</h2>
      <p>Please enter your credentials to continue</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <p-floatLabel>
          <input pInputText id="username" type="text" [(ngModel)]="credentials.username" name="username" required />
          <label for="username">Username</label>
        </p-floatLabel>
      </div>

      <div class="form-field">
        <p-floatLabel>
          <input pInputText id="password" type="password" [(ngModel)]="credentials.password" name="password" required />
          <label for="password">Password</label>
        </p-floatLabel>
      </div>

      <p-button
        type="submit"
        label="Log In"
        [loading]="!loading"
        icon="pi pi-sign-in"
        iconPos="left"
        class="login-button">
      </p-button>
    </form>

    <div class="login-footer">
      <a href="#">Forgot password?</a>
      <span>·</span>
      <a href="#">Create account</a>
    </div>
  </div>
</div>
