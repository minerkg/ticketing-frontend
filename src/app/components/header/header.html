<p-menubar [model]="items()">

  <ng-template pTemplate="end">
    @if (!authService.loggedIn()) {
      <p-button
        type="button"
        [label]="'Login'"
        [icon]="'pi pi-sign-in'"
        (onClick)="login()">
      </p-button>
    }
    @if (authService.loggedIn()) {
      <p-button
        type="button"
        [label]="'Logout'"
        [icon]="'pi pi-sign-out'"
        (click)="logout()">
      </p-button>
    }
  </ng-template>
</p-menubar>
