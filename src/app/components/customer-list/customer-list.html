<p-table [value]="customerList()">
  <ng-template pTemplate="header">
    <tr>
      <th>First name</th>
      <th>Last name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Action</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-customer>
    <tr>
      <td>{{ customer.firstName }}</td>
      <td>{{ customer.lastName }}</td>
      <td>{{ customer.email }}</td>
      <td>{{ customer.phoneNumber }}</td>
      <td>
        <!--        <pButton type="button" label="View the tickets of the customer" icon="pi pi-user" (click)="viewClientTickets(customer)"></pButton>-->
      </td>
    </tr>
  </ng-template>
</p-table>
