<div class="register-wrapper">
  <div class="register-card">
    <h2>Change Password</h2>

    <form class="register-form" (ngSubmit)="onSubmit()" #form="ngForm" novalidate>
      <div class="form-row">
        <p-float-label class="full-width">
          <input id="userName" type="text" pInputText [(ngModel)]="userName" name="userName" required />
          <label for="userName">Username</label>
        </p-float-label>
      </div>

      <div class="form-row">
        <p-float-label class="full-width">
          <input id="oldPassword" type="password" pInputText [(ngModel)]="oldPassword" name="oldPassword" required />
          <label for="oldPassword">Current Password</label>
        </p-float-label>
      </div>

      <div class="form-row">
        <p-float-label class="full-width">
          <input id="newPassword" type="password" pInputText [(ngModel)]="newPassword" name="newPassword" required minlength="8" />
          <label for="newPassword">New Password</label>
        </p-float-label>
      </div>

      <div class="form-row">
        <p-float-label class="full-width">
          <input id="confirmPassword" type="password" pInputText [(ngModel)]="confirmPassword" name="confirmPassword" required />
          <label for="confirmPassword">Confirm New Password</label>
        </p-float-label>
      </div>

      <div class="submit-container">
        <p-button
          label="Change Password"
          icon="pi pi-key"
          type="submit"
          [disabled]="!form.form.valid || newPassword !== confirmPassword">
        </p-button>
      </div>
    </form>
  </div>
</div>
