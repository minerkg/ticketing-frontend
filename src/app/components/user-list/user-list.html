<p-table [value]="ticketingUserList()">
  <ng-template pTemplate="header">
    <tr>
      <th>Username</th>
      <th>Role</th>
      <th>Email</th>
      <th>Enabled</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.userRole }}</td>
      <td>{{ user.email }}</td>
      <td>
        @if (loggedInUserRole === UserRoleEnum.Admin) {
          <p-toggle-switch
            [(ngModel)]="user.accountEnabled"
            (onChange)="toggleUserAccount(user)">
          </p-toggle-switch>
        } @else {
          <span>{{ user.accountEnabled ? 'Enabled' : 'Disabled' }}</span>
        }
      </td>


      <td>
        <div class="actions mb-3">
          <p-button
            type="button"
            label="View"
            icon="pi pi-user"
            (click)="viewUser(user.id)"
          ></p-button>
          @if (loggedInUserRole === UserRoleEnum.Admin) {
            <p-select
              [options]="roleList"
              [(ngModel)]="user.userRole"
              placeholder="Select role"
              appendTo="body"
            >
            </p-select>

            <p-button
              type="button"
              label="Edit role"
              icon="pi pi-pencil"
              (click)="updateUserRole(user)">
            </p-button>
          }
        </div>
      </td>

    </tr>
  </ng-template>
</p-table>
